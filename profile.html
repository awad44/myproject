<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>PROFILE</title>
</head>

<body>
  <div data-bs-theme="dark">
    <a href="/page02.html">
      <button type="button" class="btn-close" aria-label="Close"></button>
    </a>
  </div>

  <div class="A00">
    <div class="container text-center">
      <div>
        <img class="pro-start animate__animated animate__flip" src="/icons/User.png" alt="User Icon" width="66">
        <h2><b>Username</b></h2>
      </div>

      <div id="st01" class="arrange animate__animated animate__fadeInRight">
        <h3>Status</h3>
        <button class="toggle" id="liveToastBtn">
          <div class="circle"></div>
        </button>
        <div class="btm01">
          <button type="button" class="btn btn-secondary btn-lg animate__animated animate__fadeInLeft" style="margin-top: 10px;">
            <a href="/loginForm.html"><img src="/icons/profile-icons/icons8-lock.gif" alt="Lock Icon" width="40" style="border-radius: 33%;">&nbsp;&nbsp;Log-in</a>
          </button>
        </div>
      </div>

      <div id="A02" class="mt-4">
        <div class="d-grid gap-2 col-6 mx-auto">
          <button class="btn btn-secondary btn-lg animate__animated animate__fadeInRight" type="button">
            <img src="/icons/profile-icons/icons8-bell.gif" alt="Bell Icon" width="40" style="border-radius: 33%;">&nbsp;&nbsp;Subscribe
          </button>
        </div>
        <div class="d-grid gap-2 col-6 mx-auto mt-3">
          <button class="btn btn-secondary btn-lg animate__animated animate__fadeInLeft" type="button">Brokers</button>
        </div>
      </div>
    </div> 

    <section class="A03">
      <div class="d-grid gap-2 col-6 mx-auto">
        <button class="btn btn-secondary btn-lg animate__animated animate__fadeInRight" type="button">
          <img src="/icons/profile-icons/icons8-community-50.png" alt="Community Icon" width="40" style="border-radius: 33%;">&nbsp;&nbsp;Community
        </button>
        <button type="button" class="btn btn-secondary btn-lg animate__animated animate__fadeInLeft">
          <img src="/icons/profile-icons/icons8-sparkling.gif" alt="Free Signals Icon" width="30" style="border-radius: 22%;">&nbsp;Free Signals
        </button>
      </div>
    </section>

    <section>
      <nav id="A05">
        <div class="d-grid gap-2">
          <button class="btn btn-secondary btn-lg animate__animated animate__fadeInRight" type="button" style="height: 50px;">
            <img src="/icons/profile-icons/icons8-settings.gif" alt="Settings Icon" width="30" style="border-radius: 12%;">&nbsp;&nbsp;Settings
          </button>
          <button class="btn btn-secondary btn-lg animate__animated animate__fadeInLeft" type="button" style="height: 50px;">
            <img src="/icons/profile-icons/icons8-fog.gif" alt="Mode Icon" width="35" style="border-radius: 33%;">&nbsp;&nbsp;Mode
          </button>
        </div>
      </nav>
    </section>
  </div>

  <footer>
    <section>
      <div class="one">
        <nav><img src="/icons/icons8-facebook-logo-48.png" alt="Facebook" width="50"></nav>
        <nav><img src="/icons/icons8-instagram-48.png" alt="Instagram" width="50"></nav>
        <nav><img src="/icons/icons8-linkedin-logo-94.png" alt="LinkedIn" width="50"></nav>
        <nav><img src="/icons/icons8-mail-94.png" alt="Email" width="50"></nav>
        <nav><img src="/icons/icons8-telegram-app-48.png" alt="Telegram" width="50"></nav>
      </div>
    </section>
    <section>
      <div class="two">
        <nav><img src="/icons/icons8-rate-100.png" alt="Rate Us" width="50">Rate Us</nav>
        <nav><img src="/icons/icons8-help-100.png" alt="Help Center" width="50">Help Center</nav>
        <nav><img src="/icons/icons8-about-100.png" alt="About" width="50">About</nav>
      </div>
    </section>
  </footer>

  <script>
    // JavaScript for toggle button functionality
    document.getElementById('liveToastBtn').addEventListener('click', function() {
        this.classList.toggle('active');
    });
  </script>

</body>

<style>
  body {
    background-image: url(/imgs/pexels-suzyhazelwood-1629236.jpg);
    padding-left: 25%;
    padding-right: 25%;
    padding-top:3%;
    padding-bottom: 3%;
    color: aliceblue;
    background-size: cover;
  }

  .pro-start {
    border-style: solid;
    color: blue;
    border-radius: 50px;
  }

  .toggle {
    width: 100px;
    height: 50px;
    background-color: grey;
    border-radius: 20px;
    display: flex;
    align-items: center;
    padding: 5px;
    transition: background-color 0.3s ease;
    border: none;
    margin-left: 3%;
  }

  .circle {
    width: 35px;
    height: 35px;
    background-color: white;
    border-radius: 50%;
    transition: transform 0.3s ease;
  }

  .toggle.active {
    background-color: #1cc668;
  }

  .toggle.active .circle {
    transform: translateX(55px);
  }

  .container {
    padding: 0;
 

  }

  .A00 {
    text-align: center;
    box-shadow: 15px 15px 3px rgb(0, 0, 188);
    padding: 5%;
    border-style: solid;
  border-width: 4px;
  border-color: rgb(250, 247, 247);
  }

  #st01 {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .arrange {
    padding: 1%;
    border-radius: 5%;
  }

  .A03 {
    display: flex;
    justify-content: center;
    flex-direction: column;
    padding-top: 15px;
  }

  #A05 {
    margin-top: 2%;
  }

  .one {
    margin-top: 50px;
    display: flex;
    justify-content: center;
    gap: 15px;
  }

  .two {
    margin-top: 10px;
    display: flex;
    justify-content: center;
    gap: 15px;
    font-weight: 500;
    font-size: larger;
  }

  /* Improved responsiveness for small screens */
  @media (max-width: 768px) {
    .one, .two {
      flex-direction: column;
      margin-left: 0;
      gap: 10px;
    }

    .A00 {
      padding: 10%;
    }
  }
</style>

</html>
